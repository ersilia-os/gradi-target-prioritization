name: Deploy the target browser to Pages

# The new browser (webapp/) is the default site at the root; the previous v1 site
# (legacy/app, byte-identical to release v1.0.0) stays reachable under /v1/.
on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "legacy/app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/v1
          cp -R webapp/. _site/
          rm -f _site/serve.sh _site/README.md _site/DESIGN.md      # dev files, not part of the site
          cp -R legacy/app/. _site/v1/
          rm -f _site/v1/serve.sh _site/v1/README.md
          # rewrite ?v=... on the CSS/JS asset tags so every deploy ships uniquely-versioned
          # assets (no manual bumping, no stale cache after a deploy)
          sed -i "s/?v=[0-9A-Za-z._-]*/?v=${GITHUB_SHA::12}/g" _site/index.html _site/v1/index.html
          grep -o '?v=[0-9A-Za-z._-]*' _site/index.html | sort -u
          # fail the deploy rather than publish an empty site
          test -s _site/data/ec.json && test -s _site/data/kp.json && test -s _site/v1/data/kp.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
